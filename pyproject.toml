[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accountable"
version = "0.1.0"
description = "Accountable measurement campaigns: interest and interpolation certificates with finite-sample risk control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
legacy = ["ssbc"]
gp = ["botorch>=0.12", "torch"]
plots = ["matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full campaign runs against the legacy reference"]
